name: Code quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Check formatting
        run: ruff format --check anony config.py
      - name: Check lint
        run: ruff check anony config.py
