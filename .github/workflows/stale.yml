name: Manage stale issues and pull requests

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs.'
          close-issue-message: 'Closed because it has remained inactive after being marked stale.'
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had recent activity.'
          close-pr-message: 'Closed because it has remained inactive after being marked stale.'
          days-before-stale: 60
          days-before-close: 14
