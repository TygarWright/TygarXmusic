services:
  tygarxmusic:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017/tygarx
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - downloads:/app/downloads
      - cookies:/app/anony/cookies

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  downloads:
  cookies:
  mongo_data:
